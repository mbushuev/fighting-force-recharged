name: Build release candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the exact source and complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate source version and tag
        id: metadata
        shell: pwsh
        run: |
          $arguments = @('scripts/release_metadata.py')
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments += @('--tag', $env:GITHUB_REF_NAME) }
          $version = (& python @arguments).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata rejected.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Fetch only reviewed build dependencies
        shell: pwsh
        run: ./scripts/fetch_build_dependencies.ps1
      - name: Build, test and verify complete candidate
        shell: pwsh
        run: >-
          ./scripts/build_release.ps1
          -RuntimeDirectory build/dependencies/runtime
          -UnshieldDirectory build/dependencies/unshield
      - name: Preserve candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FightingForceRecharged-${{ github.sha }}
          path: dist/releases/${{ steps.metadata.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

  verify-download:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the Windows-built candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FightingForceRecharged-${{ github.sha }}
          path: candidate
      - name: Independently verify archives, source and checksums
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/verify_release.py --directory candidate --revision "$SOURCE_REVISION"

  prepare-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-download]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FightingForceRecharged-${{ github.sha }}
          path: candidate
      - name: Verify again before attaching assets
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/verify_release.py --directory candidate --revision "$SOURCE_REVISION"
      - name: Create an unpublished draft only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--draft --verify-tag --title "Fighting Force Recharged $SOURCE_VERSION"
                --notes-file ".github/release-notes/$SOURCE_TAG.md")
          if [[ "$SOURCE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$SOURCE_TAG" candidate/* "${args[@]}"
