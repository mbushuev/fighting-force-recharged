[Compatibility]
; Separate wrapper settings. Original game files are never modified on disk.
RecoverKeyboard = 1
; Avoid blocking surface flips; keep dispatching Windows messages while inactive.
ResponsivePresentation = 1
; Show the original copyright image long enough to read, with smooth transitions.
ShortStartupScreen = 1
StartupScreenMs = 2500
; Skip the fixed three-second disc-spin delay; actual disc/file reads remain native.
ShortLoadingWait = 1
; Keep the real mounted disc's CD-audio device open between transitions.
ReuseCDAudio = 1
; Cover native video/window/device replacement, then fade in completed frames.
SmoothTransitions = 1
StableFarDepth = 1
; Preserve opaque cutouts with filtered edge colors; retain native translucent passes.
SmoothTransparentEdges = 1
[Rendering]
; Experimental: 60 = interpolate displayed gameplay frames; 30 = native cadence.
; Both modes retain the native simulation step. Restart after changing this.
GameplayFPS = 60
; 0 = original 4:3; 1 = current monitor aspect; e.g. 1778 = manual 16:9.
; Expand the 3D view horizontally; keep HUD/menu proportions and movie framing.
WidescreenAspectX1000 = 1
[Camera]
; Experimental independent orbit for live single-player gameplay.
; Mouse = look, wheel = distance, middle / R3 = target focus or recenter.
; Right stick = look; LT/RT = zoom out/in on the controller selected under Input.
; 0 restores the original level-directed camera after restarting the game.
FreeOrbit = 1
; Tab / L3 toggles an animated view from the character's eyes during gameplay.
; Preserve native arms/body; wheel and triggers adjust only third-person distance.
FirstPerson = 1
; Two-player mode: 0 = original shared camera, 1 = dynamic shared/split camera.
; Change this in Options > Controller Settings without restarting.
; Separate smoothly when they spread out, are occluded, or either selects L3 eyes.
; Each player's right stick controls their camera; single-player is unaffected.
; Older configurations may use DynamicSplitScreen as a fallback for this value.
CooperativeCamera = 1
Distance = 720
TargetHeight = 160
; Keep the camera above the followed character's feet, including at long zoom.
GroundClearance = 128
MouseHorizontalMilliDegrees = 150
MouseVerticalMilliDegrees = 120
StickDegreesPerSecond = 120
; Independent first-person sensitivity: approximately 25% above orbit defaults.
FirstPersonMouseHorizontalMilliDegrees = 188
FirstPersonMouseVerticalMilliDegrees = 150
FirstPersonStickDegreesPerSecond = 150
; Full trigger pressure changes distance three times faster than the old default.
TriggerZoomUnitsPerSecond = 720
InvertY = 0
[Input]
; WASD movement; Space jump; left Shift run; E backfist; J/K punch/kick.
; Esc/P pause. Menus: WASD, Enter/Space confirm, Esc back or quit on the main menu.
; F10 opens quit in gameplay and menus. Enter/Y accepts; Esc/N cancels.
ModernKeyboard = 1
; Xbox / XInput-compatible controllers: automatic connection and reconnection.
; Left stick controls walking speed; hold RB to run. D-pad uses native walk speed.
; A jump; X punch; Y kick; B backfist; RB requests full run speed; L3 switches view.
; Right stick look/switch target; R3 focus/recenter; LT/RT zoom; Start pause; View quit.
; Menus: A/Start confirm, B back; B opens quit on the main menu. A yes, B no.
Gamepad = 1
; Short XInput pulses for confirmed hits, damage and successful player blocks.
; Change Vibration in Options > Controller Settings, then Save and Back.
Vibration = 1
; Smooth unarmed walking speed before native collision; 0 uses native walking speed.
AnalogMovement = 1
; Player one's pad: -1 = automatic, 0..3 = fixed XInput slot (menu shows 1..4).
; Ignored for a cooperative player assigned keyboard/mouse.
ControllerIndex = -1
; Player two's pad; automatic selection excludes the other player's device.
Controller2Index = -1
; Co-op input: 1 = keyboard/mouse + pad; 2 = two pads; 3 = pad + keyboard/mouse.
; Options > Controller Settings (or F6 on the main menu) edits devices/buttons.
CooperativeInput = 1
LeftStickDeadzone = 7849
RightStickDeadzone = 8689
; Left mouse button = punch, right mouse button = kick by default.
; Saving the controls menu enables modern input and replaces legacy action bindings.
; Per-player bindings are saved in Player1Bindings/Player2Bindings in this INI.
MouseCombat = 1
[Combat]
; Optional guard with empty hands or light items for all four heroes. Q / LB by default.
; Stops ordinary frontal punches/kicks; rear hits and other attack paths remain native.
; Requires the reviewed hero and CHARS11/CHARS15 archives.
; Options > Gameplay Settings edits these choices. Choose Save and Back to apply.
PlayerGuard = 0
; R3 / middle mouse locks a visible enemy; press again to release.
; Without a target, the same action recenters the camera. Z/C switch targets.
TargetFocus = 1
; Visual switches do not disable target focus or change damage/trajectory.
TargetMarker = 1
; Barrel-mounted first-person pistol/shotgun laser. Blue loaded, red empty.
WeaponLaser = 1
; Dashed flight guide for carried grenades and heavy throw-only objects.
ThrowTrajectory = 1
[Diagnostics]
TraceRenderer = 0
; Aggregate shared/split frame timing; local diagnostics only.
TraceCooperative = 0
; Aggregate presentation/native-update rates; local diagnostics only.
TraceFrameRate = 0
; Sparse weapon attachment diagnostics; local development only.
TraceCombatFocus = 0
