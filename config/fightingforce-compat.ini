[Compatibility]
; Separate wrapper settings. Original game files are never modified on disk.
RecoverKeyboard = 1
; Show the original copyright image long enough to read, with smooth transitions.
ShortStartupScreen = 1
StartupScreenMs = 2500
; Keep the real mounted disc's CD-audio device open between transitions.
ReuseCDAudio = 1
; Cover native video/window/device replacement, then fade in completed frames.
SmoothTransitions = 1
StableFarDepth = 1
; Preserve opaque cutouts with filtered edge colors; retain native translucent passes.
SmoothTransparentEdges = 1
[Rendering]
; 0 = original 4:3; 1 = current monitor aspect; e.g. 1778 = manual 16:9.
; Expand the 3D view horizontally; keep HUD/menu proportions and movie framing.
WidescreenAspectX1000 = 1
[Camera]
; Experimental independent orbit for live single-player gameplay.
; Mouse = look, wheel = distance, middle button / R3 = recenter behind player.
; Right stick = look; LT/RT = zoom out/in on the controller selected under Input.
; 0 restores the original level-directed camera after restarting the game.
FreeOrbit = 1
Distance = 720
TargetHeight = 160
; Keep the camera above the followed character's feet, including at long zoom.
GroundClearance = 128
MouseHorizontalMilliDegrees = 150
MouseVerticalMilliDegrees = 120
StickDegreesPerSecond = 120
InvertY = 0
[Input]
; WASD movement; Space jump; left Shift run; E backfist; J/K punch/kick.
; Esc/P pause. Menus: WASD, Enter/Space confirm, Esc back. Q still opens quit.
ModernKeyboard = 1
; Xbox / XInput-compatible controllers: automatic connection and reconnection.
; Left stick / D-pad move; A jump; X punch; Y kick; B backfist; RB/L3 run.
; Right stick look; R3 recenter; LT/RT zoom; Start pause; View opens quit.
; Menus: A/Start confirm, B back. Quit prompt: A yes, B no.
Gamepad = 1
; -1 selects the first connected XInput slot; 0..3 selects a fixed slot.
ControllerIndex = -1
LeftStickDeadzone = 7849
RightStickDeadzone = 8689
; Additional gameplay-only actions; existing keyboard and joystick bindings remain.
; Left mouse button = punch, right mouse button = kick. Independent of FreeOrbit.
MouseCombat = 1
[Diagnostics]
TraceRenderer = 0
